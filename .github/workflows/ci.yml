name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Windows 러너의 콘솔은 cp1252 라 한글 출력(감사기, OpenAPI 덤프)이 UnicodeEncodeError 로 죽는다 (CI 실측 2026-09-03).
# Python UTF-8 모드는 표준 입출력과 기본 파일 인코딩을 UTF-8 로 고정한다
env:
  PYTHONUTF8: "1"

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      # 감사기의 이력 검사는 도달 가능한 커밋 전부를 본다. checkout 기본값(fetch-depth 1)이면
      # 커밋 1개만 보고 조용히 통과한다 (2026-09-07 설계 판단: 검사가 있는 것처럼 보이는 상태를 만들지 않는다)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 공개 저장소 추적 파일과 이력 감사
        run: python scripts/audit_public_repo.py --history

      - name: 체크아웃 줄바꿈 바이트 검사 (bat 는 CRLF, 셸 픽스처는 LF)
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          for name in ("SlideCaptain실행.bat", "Windows검수준비.bat"):
              bat = Path(name).read_bytes()
              assert b"\r\n" in bat, f"{name} must be CRLF"
          for name in ("backend/tests/fixtures/eol/probe.sh", "backend/tests/fixtures/eol/probe.command"):
              data = Path(name).read_bytes()
              assert data and b"\r" not in data, f"{name} must be LF"
          command_script = Path("SlideCaptain실행.command").read_bytes()
          assert command_script and b"\r" not in command_script, "SlideCaptain실행.command must be LF"
          ls_files = subprocess.run(
              ["git", "ls-files", "-s", "--", "SlideCaptain실행.command"],
              capture_output=True, text=True, check=True,
          ).stdout.strip()
          assert ls_files.startswith("100755"), f"SlideCaptain실행.command must be executable in the git index: {ls_files!r}"
          print("eol bytes ok")

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 백엔드 설치
        run: python -m pip install -c backend/requirements-release.txt -e "./backend[dev,desktop]"

      - name: 프런트 설치
        working-directory: frontend
        run: npm ci

      - name: 독립 앱 설치
        working-directory: desktop
        run: npm ci

      - name: 백엔드 테스트
        working-directory: backend
        run: python -m pytest tests -q

      - name: OpenAPI 재생성
        working-directory: backend
        run: python scripts/dump_openapi.py

      - name: 프런트 타입 재생성
        working-directory: frontend
        run: npm run generate-types

      - name: 생성 파일 무변경 확인
        run: git diff --exit-code -- backend/openapi.json frontend/src/api/types.ts

      - name: 독립 앱 API 경로 일치 및 런타임 테스트
        run: python scripts/check_desktop_routes.py

      - name: 독립 앱 런타임 테스트
        working-directory: desktop
        run: npm test

      - name: 프런트 테스트
        working-directory: frontend
        run: npm test

      - name: 화면 빌드
        working-directory: frontend
        run: npm run build

      - name: 독립 서비스 패키징 및 실제 가져오기·저장·내보내기·재시작
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'slidecaptain-desktop-service'
          subprocess.run([sys.executable, 'scripts/build_desktop_service.py', '--out-dir', str(output)], check=True)
          service = output / 'slidecaptain-service' / ('slidecaptain-service.exe' if os.name == 'nt' else 'slidecaptain-service')
          subprocess.run(['node', 'desktop/scripts/smoke-service.cjs', str(service)], check=True)

      - name: 독립 앱 미서명 검증 패키지 구성
        working-directory: desktop
        env:
          SLIDECAPTAIN_BACKEND_RESOURCE: ${{ runner.temp }}/slidecaptain-desktop-service/slidecaptain-service
          SLIDECAPTAIN_DESKTOP_OUTPUT: ${{ runner.temp }}/slidecaptain-desktop-app
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist -- --dir

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-spike-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/slidecaptain-desktop-app/**
            ${{ runner.temp }}/slidecaptain-desktop-service/desktop-build.json

      - name: 로컬 릴리스 패키지 빌드
        run: |
          python -m pip install uv
          python scripts/build_release.py --out-dir "${{ runner.temp }}/slidecaptain-release"

      - name: 새 환경에 배포본 설치
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import zipfile
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'slidecaptain-release'
          target = Path(os.environ['RUNNER_TEMP']) / 'slidecaptain-installed'
          bundles = list(output.glob('slidecaptain-*-local.zip'))
          assert len(bundles) == 1
          with zipfile.ZipFile(bundles[0]) as archive:
              archive.extractall(target)
          launchers = list(target.rglob('release_launcher.py'))
          assert len(launchers) == 1
          launcher = launchers[0]
          subprocess.run([sys.executable, str(launcher), '--install-only'], check=True)
          python = launcher.parent / '.venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([sys.executable, 'scripts/smoke_release.py', '--python', str(python)], check=True)

      - uses: actions/upload-artifact@v4
        with:
          name: local-release-${{ matrix.os }}
          path: ${{ runner.temp }}/slidecaptain-release/*
