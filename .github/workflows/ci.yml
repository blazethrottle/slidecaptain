name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Windows 러너의 콘솔은 cp1252 라 한글 출력(감사기, OpenAPI 덤프)이 UnicodeEncodeError 로 죽는다 (CI 실측 2026-09-03).
# Python UTF-8 모드는 표준 입출력과 기본 파일 인코딩을 UTF-8 로 고정한다
env:
  PYTHONUTF8: "1"

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 체크아웃 줄바꿈 바이트 검사 (bat 는 CRLF, 셸 픽스처는 LF)
        shell: python
        run: |
          from pathlib import Path
          bat = Path("SlideCaptain실행.bat").read_bytes()
          assert b"\r\n" in bat, "batch file must be CRLF"
          for name in ("backend/tests/fixtures/eol/probe.sh", "backend/tests/fixtures/eol/probe.command"):
              data = Path(name).read_bytes()
              assert data and b"\r" not in data, f"{name} must be LF"
          print("eol bytes ok")

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 백엔드 설치
        run: python -m pip install -e "./backend[dev]"

      - name: 프런트 설치
        working-directory: frontend
        run: npm ci

      - name: 공개 저장소 추적 파일 감사
        run: python scripts/audit_public_repo.py

      - name: 백엔드 테스트
        working-directory: backend
        run: python -m pytest tests -q

      - name: OpenAPI 재생성
        working-directory: backend
        run: python scripts/dump_openapi.py

      - name: 프런트 타입 재생성
        working-directory: frontend
        run: npm run generate-types

      - name: 생성 파일 무변경 확인
        run: git diff --exit-code -- backend/openapi.json frontend/src/api/types.ts

      - name: 프런트 테스트
        working-directory: frontend
        run: npm test

      - name: 화면 빌드
        working-directory: frontend
        run: npm run build
